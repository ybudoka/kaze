name: Tests

# Chaque correctif est couvert par un contrôle : on les rejoue à chaque push,
# pour qu'une régression se voie sur le dépôt plutôt qu'en jouant.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule l'exécution précédente : inutile de faire tourner
# une suite sur du code déjà remplacé.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Suite de tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      # Le navigateur est mis en cache : sans cela, chaque exécution le
      # retélécharge (~130 Mo).
      - name: Restaurer le navigateur
        id: cache-navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache manquant : on installe navigateur ET dépendances système.
      # Cache présent : le binaire est déjà là, on évite le apt-get qui
      # coûtait à lui seul une douzaine de secondes à chaque exécution.
      - name: Installer Chromium (cache manquant)
        if: steps.cache-navigateur.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Vérifier Chromium (cache présent)
        if: steps.cache-navigateur.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Lancer la suite
        run: npm test
