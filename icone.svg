<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Kaze &amp; les Trois Étoiles</title>
  <!-- Le ciel de l'écran-titre, et l'étoile dessinée pixel par pixel dans
       l'esprit du sprite « etoile » du jeu : mêmes ors, même contour sombre.
       Tout tient sur une grille de 16, avec une marge d'un pixel : à la taille
       d'un favicon, le dessin reste net et la silhouette respire. -->
  <defs>
    <radialGradient id="ciel" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#141a2c"/>
      <stop offset="0.7" stop-color="#07080e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffb04a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="16" height="16" fill="url(#ciel)"/>

  <!-- étoiles lointaines -->
  <rect x="1" y="1" width="1" height="1" fill="#8f9cc4"/>
  <rect x="14" y="2" width="1" height="1" fill="#6b7ba8"/>
  <rect x="2" y="14" width="1" height="1" fill="#6b7ba8"/>
  <rect x="13" y="13" width="1" height="1" fill="#8f9cc4"/>

  <!-- lueur -->
  <rect width="16" height="16" fill="url(#halo)"/>

  <!-- contour sombre, comme les sprites du jeu -->
  <rect x="5" y="1" width="6" height="14" fill="#14101f"/>
  <rect x="1" y="5" width="14" height="6" fill="#14101f"/>
  <rect x="3" y="3" width="10" height="10" fill="#14101f"/>

  <!-- l'étoile -->
  <rect x="6" y="2" width="4" height="12" fill="#ffe86a"/>
  <rect x="2" y="6" width="12" height="4" fill="#ffe86a"/>
  <rect x="4" y="4" width="8" height="8" fill="#ffe86a"/>
  <rect x="6" y="6" width="4" height="4" fill="#fffbe0"/>
  <rect x="4" y="4" width="2" height="2" fill="#f0c83c"/>
  <rect x="10" y="10" width="2" height="2" fill="#f0c83c"/>
</svg>
